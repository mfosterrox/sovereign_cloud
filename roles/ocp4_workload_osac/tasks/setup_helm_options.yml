---
- name: Read cluster base domain for hosted lab clusters
  when: ocp4_workload_osac_bmf_enabled | bool
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: DNS
    name: cluster
  register: r_cluster_dns

- name: Setup Helm deployment options
  delegate_to: "{{ _bastion_host }}"
  block:
  - name: Read infra Helm values
    ansible.builtin.slurp:
      src: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/infra.yaml
    register: r_osac_infra_values
    no_log: true

  - name: Configure lab infra Helm values
    vars:
      _ocp4_workload_osac_infra_overrides:
        certManager:
          enabled: false  # Pre-installed by the platform
        lvms:
          enabled: "{{ ocp4_workload_osac_lvms_enabled | bool }}"
        metal3:
          enabled: "{{ ocp4_workload_osac_bmf_enabled | bool }}"
        keycloak:
          adminUsername: "{{ ocp4_workload_osac_admin_user }}"
          adminPassword: "{{ _ocp4_workload_osac_admin_password }}"
          defaultUserPassword: "{{ _ocp4_workload_osac_user_password }}"
          route:
            publicIngress: true
    ansible.builtin.copy:
      dest: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/infra.yaml
      content: >-
        {{
          r_osac_infra_values.content | b64decode | from_yaml
          | combine(_ocp4_workload_osac_infra_overrides, recursive=true)
          | combine(
              {'lvms': {'deviceSelector': {'optionalPaths': ocp4_workload_osac_lvms_disks}}}
              if ocp4_workload_osac_lvms_enabled | bool and ocp4_workload_osac_lvms_disks | length > 0
              else {},
              recursive=true
            )
          | to_nice_yaml(indent=2)
        }}
      owner: "{{ ansible_user }}"
      mode: ug=rw,o=r
    no_log: true

  - name: Read instance Helm values
    ansible.builtin.slurp:
      src: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/instance.yaml
    register: r_osac_instance_values
    no_log: true

  - name: Configure lab instance Helm values
    vars:
      _ocp4_workload_osac_instance_overrides:
        global:
          services:
            bmaas:
              enabled: "{{ ocp4_workload_osac_bmf_enabled | bool }}"
        bmf:
          metal3:
            enabled: "{{ ocp4_workload_osac_bmf_enabled | bool }}"
            namespace: "{{ ocp4_workload_osac_namespace }}"
      _ocp4_workload_osac_caas_overrides:
        aap:
          instanceGroups:
            clusterFulfillment:
              config:
                DNS_CLASS: dns.noop.dns
                EXTERNAL_ACCESS_BASE_DOMAIN: "hosted.{{ r_cluster_dns.resources[0].spec.baseDomain }}"
                HOSTED_CLUSTER_BASE_DOMAIN: "hosted.{{ r_cluster_dns.resources[0].spec.baseDomain }}"
                HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: SingleReplica
                HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: SingleReplica
    ansible.builtin.copy:
      dest: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/values/{{ ocp4_workload_osac_installer_profile }}/instance.yaml
      content: >-
        {{
          r_osac_instance_values.content | b64decode | from_yaml
          | combine(_ocp4_workload_osac_instance_overrides, recursive=true)
          | combine(_ocp4_workload_osac_caas_overrides if ocp4_workload_osac_bmf_enabled | bool else {}, recursive=true)
          | combine(
              {'ui': {'images': {'ui': 'ghcr.io/osac-project/osac-ui:' + ocp4_workload_osac_ui_image_tag}}}
              if ocp4_workload_osac_ui_image_tag | default('') | length > 0 else {},
              recursive=true
            )
          | to_nice_yaml(indent=2)
        }}
      owner: "{{ ansible_user }}"
      mode: ug=rw,o=r
    no_log: true

  - name: Set up LVM Storage
    when: ocp4_workload_osac_lvms_enabled | bool
    block:
    - name: Patch LVMS operator chart namespace to openshift-lvm-storage in osac-deps
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-deps/templates/lvms.yaml
        regexp: openshift-storage
        replace: openshift-lvm-storage

    - name: Patch LVMS operator chart namespace to openshift-lvm-storage in osac-infra
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/lvms.yaml
        regexp: openshift-storage
        replace: openshift-lvm-storage

    - name: Patch LVMS configure-lvms.sh namespace to openshift-lvm-storage in osac-infra
      ansible.builtin.replace:
        path: >-
          ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/files/hooks/configure-lvms.sh
        regexp: openshift-storage
        replace: openshift-lvm-storage

  - name: Patch keycloak set-passwords script - exact user lookup
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'users\?username=\$username"'
      replace: 'users?username=$username&exact=true"'

  - name: Patch keycloak set-passwords script - safe Python indexing
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'import sys,json; print\(json\.load\(sys\.stdin\)\[0\]\[.id.\]\)'
      replace: "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')"

  - name: Patch keycloak set-passwords script - skip missing users gracefully
    ansible.builtin.replace:
      path: >-
        ~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts/osac-infra/templates/keycloak/resources.yaml
      regexp: 'Could not find user.*return 1'
      replace: 'User $username not found, skipping"; return 0'

  - name: Find Helm hook YAML files
    ansible.builtin.find:
      paths: "~{{ ansible_user }}/{{ ocp4_workload_osac_installer_directory }}/charts"
      patterns: '*.yaml'
      file_type: file
      recurse: true
    register: r_hook_files

  # Infra hook memory is already controlled by hookResources (1Gi limit upstream).
  # Keep the lab allowance for hooks that still hardcode a smaller limit.
  - name: Increase hardcoded memory limits in hook jobs
    ansible.builtin.replace:
      path: "{{ item.path }}"
      regexp: '(limits:\n\s+cpu: \S+\n\s+memory:) [0-9]+Mi'
      replace: '\g<1> 1Gi'
    loop: "{{ r_hook_files.files | selectattr('path', 'search', '/hooks/') }}"
    loop_control:
      label: "{{ item.path | basename }}"

  # Preserve hooks that deliberately disable retries (backoffLimit: 0).
  - name: Increase positive backoff limits in hook jobs
    ansible.builtin.replace:
      path: "{{ item.path }}"
      regexp: 'backoffLimit: [1-9][0-9]*'
      replace: 'backoffLimit: 30'
    loop: "{{ r_hook_files.files | selectattr('path', 'search', '/hooks/') }}"
    loop_control:
      label: "{{ item.path | basename }}"
